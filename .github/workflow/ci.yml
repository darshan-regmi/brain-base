name: CI

on:
  push:
    branches: [darshan-dev]
  pull_request:
    branches: [darshan-dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm ci
      - run: pnpm run lint
      - run: pnpm run build
